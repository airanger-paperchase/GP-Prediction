server {
    listen 8008;
    server_name localhost;

    # Serve frontend from /glmapuiapp
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Redirect /glmapuiapp to /glmapuiapp/ (trailing slash)
    location = /glmapuiapp {
        return 301 /glmapuiapp/;
    }

    # Serve app files
    location /glmapuiapp/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /glmapuiapp/index.html;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location /glmapuiapp/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Handle 404 errors
    error_page 404 /glmapuiapp/index.html;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
