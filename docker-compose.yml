version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "6514:6514"
    volumes:
      - ./backend/company_data:/app/company_data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
